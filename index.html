<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EchLub DAW Demo</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1c1c1e; --panel: #2a2a2d; --ink: #ececee; --muted: #a0a0a8; --line: #3a3a3f;
    --accent: #6c9bff; --accent-ink: #0b1020; --bad: #ff8a80; --ok: #5fd28a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html, body { overscroll-behavior: none; }
  /* One finger on the canvas is the app's pointer (tap, drag, scroll): the page itself must not scroll or zoom under it. */
  #app { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { position: absolute; inset: 0 0 32px 0; width: 100%; height: calc(100% - 32px); display: block; background: var(--bg); }
  #shell { position: absolute; left: 0; right: 0; bottom: 0; height: 32px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  #shell .muted { color: var(--muted); }
  #shell button { font: inherit; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--accent);
    color: var(--accent-ink); cursor: pointer; }
  #shell button[aria-pressed="true"] { background: transparent; color: var(--ink); }
  #shell a { color: var(--accent); }
  #shell select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
  #shell .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* A phone's narrow bar: the button and the song menu keep their size, the
     sound line shortens with an ellipsis, the demo note goes. */
  #shell > button, #shell > select { flex-shrink: 0; }
  #audio { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 700px), (max-height: 500px) { #shell .note { display: none; } }
  /* A phone's narrow page: the app and the bar stack in a column, and the bar
     grows with what it says: the sound line (queue, speed, hash check) wraps
     onto a line of its own above the controls instead of being cut off, and
     the controls are a finger's height. The desktop layout above is untouched. */
  #rotate { display: none; }
  @media (max-width: 700px), (max-height: 500px) {
    body { display: flex; flex-direction: column; }
    #app { position: static; flex: 1 1 0; height: 0; min-height: 0; width: 100%; }
    #shell { position: static; flex: 0 0 auto; height: auto; flex-wrap: wrap; row-gap: 6px; white-space: normal; overflow: visible;
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); }
    #audio { order: -1; flex: 1 1 100%; overflow: visible; text-overflow: clip; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    #shell button, #shell select { min-height: 36px; }
    #shell .grow { flex: 1 1 8em; white-space: normal; overflow: visible; }
    #toast, #pickbar { bottom: calc(var(--shell-h, 32px) + 16px); }
  }
  @supports (height: 100dvh) { @media (max-width: 700px), (max-height: 500px) { html, body { height: 100dvh; } } }
  /* A phone held sideways (wide but short): the bar is one row, the sound line beside the controls, smaller. */
  @media (min-width: 701px) and (max-height: 500px) {
    #shell { flex-wrap: nowrap; align-items: center; gap: 10px; padding: 3px 12px calc(3px + env(safe-area-inset-bottom, 0px)); }
    #audio { order: 0; flex: 1 1 0; min-width: 0; font-size: 11px; line-height: 1.25; }
    #shell button, #shell select { min-height: 32px; }
    #shell .grow { flex: 0 0 auto; white-space: nowrap; }
  }
  /* In portrait on a phone: a thin strip above the bar, not over the app. */
  @media (max-width: 700px) and (orientation: portrait) {
    #rotate { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: 0 4px 0 12px; min-height: 36px; background: var(--panel);
      border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    #rotate[hidden] { display: none; }
    #rotate span { flex: 1; }
    #rotate button { font: inherit; width: 44px; min-height: 36px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
  body:not([data-state="loading"]) #loading { display: none; }
  body[data-state="error"] #loading { display: flex; color: var(--bad); }
  #toast { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; opacity: 0;
    transition: opacity .2s; pointer-events: none; }
  #toast[data-show="1"] { opacity: 1; }
  #toast[data-show="1"][data-link="1"] { pointer-events: auto; }
  #pickbar { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 4;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; display: flex; gap: 10px; align-items: center; }
  #pickbar[hidden] { display: none; }
  #pickbar button { font: inherit; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  #pickbar #pick-no { background: transparent; color: var(--ink); }
  #gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / .55); z-index: 5; }
  #gate[hidden] { display: none; }
  #gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; display: flex;
    flex-direction: column; gap: 10px; align-items: center; text-align: center; max-width: min(360px, calc(100% - 32px)); }
  #gate strong { font-size: 17px; }
  #gate .muted { color: var(--muted); }
  #gate button { font: inherit; font-size: 15px; border-radius: 8px; cursor: pointer; padding: 8px 18px; border: 1px solid var(--line); }
  #gate-on { background: var(--accent); color: var(--accent-ink); min-width: 200px; }
  #gate-off { background: transparent; color: var(--muted); }
</style>
</head>
<body data-state="loading">
<canvas id="app"></canvas>
<div id="loading"><strong id="load-title">EchLub DAW</strong><span id="load-status">Loading…</span></div>
<div id="rotate" role="note" hidden><span>Landscape gives more room · 橫放畫面空間更大</span><button id="rotate-x" type="button" aria-label="Dismiss · 關閉">✕</button></div>
<div id="shell" role="status">
  <button id="sound" type="button" aria-pressed="false">Start sound</button>
  <span id="audio" class="muted">Sound off: the engine runs on the page's clock, silently.</span>
  <select id="pick" aria-label="Song"></select>
  <span class="grow muted"><span id="song"></span> <a id="credits" href="#" target="_blank" rel="noopener" hidden>Credits</a> <a id="licences" href="CREDITS.txt" target="_blank" rel="noopener">Licences</a></span>
  <span class="muted note">Browser version: no plugins, recording or devices. Projects (.json) and MIDI open and save; exports WAV and FLAC. <span id="keep"></span></span>
</div>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
  <div class="card">
    <strong id="gate-title">Turn on sound?</strong>
    <span class="muted">開啟聲音？瀏覽器要你點一下，網頁才能發出聲音。</span>
    <button id="gate-on" type="button">Start sound · 開啟聲音</button>
    <button id="gate-off" type="button">Stay silent · 先不要</button>
  </div>
</div>
<div id="toast" role="alert"></div>
<div id="pickbar" role="dialog" aria-label="Choose a file" hidden>
  <span id="pick-label">Choose a file</span>
  <button id="pick-go" type="button">Choose…</button>
  <button id="pick-no" type="button">Cancel</button>
</div>
<pre id="report" hidden></pre>
<script type="module" src="main.js"></script>
</body>
</html>
